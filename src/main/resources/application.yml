spring:
  profiles:
    default: local
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:mysql://223.130.156.248:3306/poli?rewriteBatchedStatements=true&useSSL=false&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    username: root
    password: depends-on-profile
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 1000
        jdbc:
          batch_size: 1000
          time_zone: Asia/Seoul
    open-in-view: false
  output:
    ansi:
      enabled: always

server:
  port: 8082
  servlet:
    encoding:
      charset: UTF-8
      force-response: true
      force: true
  tomcat:
    uri-encoding: UTF-8
logging:
  file:
    path: ./logs

poli:
  chat-bot:
    url: https://chatbot.poli.ai.kr
  s3:
    endPoint: https://kr.object.ncloudstorage.com
    bucket: poli
    region: kr-standard
    access-key: depends-on-profile
    secret-key: depends-on-profile
